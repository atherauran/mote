<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f5ef;
    --ink: #1c1a17;
    --muted: #6a645b;
    --faint: #a19a8f;
    --rule: #e4ded3;
    --accent: #b5452a;
    --serif: "Newsreader", ui-serif, "New York", Georgia, "Songti SC", serif;
    --sans: system-ui, -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171615;
      --ink: #ece7de;
      --muted: #a39d93;
      --faint: #6f6a62;
      --rule: #2e2b28;
      --accent: #e58a68;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 20px/1.6 var(--serif);
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 96px 40px 80px; }
  @media (max-width: 720px) { main { padding: 56px 20px; } }

  h1 {
    font-size: clamp(44px, 7vw, 80px);
    line-height: 1;
    font-weight: 400;
    letter-spacing: -0.03em;
    margin: 0 0 64px;
  }

  ol { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  li { border-bottom: 1px solid var(--rule); }
  li a {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 4px 64px;
    padding: 28px 0;
    color: inherit;
    text-decoration: none;
  }
  .date { font: 14px/1.4 var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 8px; }
  .period {
    display: block;
    font: 600 12px/1 var(--sans);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-top: 8px;
  }
  .headline {
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: -0.015em;
    text-wrap: balance;
    transition: color 0.15s;
  }
  li a:hover .headline { color: var(--accent); }
  @media (max-width: 720px) {
    li a { grid-template-columns: 1fr; }
    .date { padding-top: 0; }
    .headline { font-size: 24px; }
  }

  .empty { display: none; color: var(--muted); padding-top: 24px; }
  ol:not(:has(li)) + .empty { display: block; }
</style>
</head>
<body>
<main>
  <h1>Reflections</h1>
  <ol>
    <!-- ENTRIES: newest first; insert new <li> directly below this line -->
  </ol>
  <p class="empty">Nothing here yet.</p>
</main>
</body>
</html>
